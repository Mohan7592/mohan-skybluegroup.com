openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Project workspace API for the Pitch Intelligence Workspace
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Pitch project workspace operations
  - name: conversations
    description: Persistent project Copilot conversations
  - name: intelligence
    description: Source-aware project intelligence and research status
  - name: inventory
    description: Imported media inventory, location data and project selections
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [projects]
      summary: Get dashboard summary and recent projects
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /brand-options:
    post:
      operationId: getBrandOptions
      tags: [projects]
      summary: Suggest source-backed companies, brands and categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandOptionsInput"
      responses:
        "200":
          description: First-party, source-backed options (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandOptionsResponse"
        "400":
          description: Invalid query
        "502":
          description: Live suggestion search or extraction failed
        "503":
          description: Live suggestions are not configured
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List pitch projects
      responses:
        "200":
          description: Pitch projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PitchProject"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a pitch project for a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created pitch project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchProject"
        "503":
          description: Project was saved but selected-brand research could not be queued; response includes projectId and a recovery action
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  projectId: { type: string, format: uuid }
                  recovery:
                    type: object
                    properties:
                      method: { type: string, enum: [POST] }
                      path: { type: string }
                      note: { type: string }
                    required: [method, path, note]
                required: [error, projectId, recovery]
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a pitch project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pitch project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchProject"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated pitch project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchProject"
  /projects/{id}/workspace:
    get:
      operationId: getProjectWorkspace
      tags: [projects]
      summary: Get the project and overview placeholders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project workspace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWorkspace"
  /projects/{id}/conversation:
    get:
      operationId: getProjectConversation
      tags: [conversations]
      summary: Get persistent project Copilot conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
  /projects/{id}/intelligence:
    get:
      operationId: getProjectIntelligence
      tags: [intelligence]
      summary: Get stored intelligence and evidence for a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Intelligence workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIntelligence"
  /projects/{id}/research/refresh:
    post:
      operationId: refreshProjectResearch
      tags: [intelligence]
      summary: Start a new persistent research run; brand confirmation is required
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Research run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchRunDetails"
        "503":
          description: Live research provider is not configured
  /projects/{id}/research/runs:
    get:
      operationId: listProjectResearchRuns
      tags: [intelligence]
      summary: List historical and current research runs
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Research runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResearchRunDetails" }
  /projects/{id}/research/runs/{runId}:
    get:
      operationId: getProjectResearchRun
      tags: [intelligence]
      summary: Get progress, brand candidates, and competitor review for a run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Research run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRunDetails" }
  /projects/{id}/research/runs/{runId}/confirm-brand:
    post:
      operationId: confirmResearchBrand
      tags: [intelligence]
      summary: Confirm an identified brand before continuing research
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandConfirmationInput" }
      responses:
        "200":
          description: Confirmed brand and resumed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRunDetails" }
  /projects/{id}/research/runs/{runId}/competitors:
    put:
      operationId: confirmResearchCompetitors
      tags: [intelligence]
      summary: Add or remove market-specific competitors and continue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetitorSelectionInput" }
      responses:
        "200":
          description: Competitors confirmed and run resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRunDetails" }
  /projects/{id}/research/runs/{runId}/deep-research:
    post:
      operationId: startDeepResearch
      tags: [intelligence]
      summary: Start optional competitor and strategy research after a pitch-focused run
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Linked deep research run queued; competitor confirmation may be required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRunDetails" }
        "404": { description: Project or run not found }
        "409": { description: Active run or invalid starting state }
  /projects/{id}/research/runs/{runId}/retry:
    post:
      operationId: retryResearchStages
      tags: [intelligence]
      summary: Retry failed or limited-evidence sections without deleting history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchRetryInput" }
      responses:
        "200":
          description: Sections queued for retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRunDetails" }
  /projects/{id}/claims/{claimId}/review:
    post:
      operationId: reviewResearchClaim
      tags: [intelligence]
      summary: Append an auditable human review of a claim
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: claimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimReviewInput" }
      responses:
        "201":
          description: Review appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimReview" }
        "400": { description: Invalid review input }
        "404": { description: Project or claim not found }
        "422": { description: Additional source could not be safely verified }
  /projects/{id}/claims/{claimId}/reviews:
    get:
      operationId: listResearchClaimReviews
      tags: [intelligence]
      summary: Get append-only claim review history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: claimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Review history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClaimReview" }
        "404": { description: Project or claim not found }
  /projects/{id}/messages:
    post:
      operationId: sendProjectMessage
      tags: [conversations]
      summary: Save a message and receive a grounded AI answer or explicit saved-context fallback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Saved message pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePair"
  /inventory/assets:
    get:
      operationId: listInventoryAssets
      tags: [inventory]
      summary: Search and filter imported inventory assets
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: assetType, in: query, schema: { type: string, maxLength: 100 } }
        - { name: area, in: query, schema: { type: string, maxLength: 120 } }
        - { name: road, in: query, schema: { type: string, maxLength: 160 } }
        - { name: availability, in: query, schema: { type: string, maxLength: 80 } }
        - { name: route, in: query, schema: { type: string, maxLength: 80 } }
        - { name: displayTechnology, in: query, schema: { type: string, enum: [static, digital] } }
        - { name: client, in: query, schema: { type: string, maxLength: 120 } }
        - { name: bookingStatus, in: query, schema: { type: string, maxLength: 80 } }
        - { name: sourceFamily, in: query, schema: { type: string, enum: [BUS_SHELTER, BUS, MANUAL, FUTURE] } }
        - { name: shelterConfiguration, in: query, schema: { type: string, enum: [SINGLE, DOUBLE] } }
        - { name: sourceMediaType, in: query, schema: { type: string, maxLength: 100 } }
        - { name: mediaUnit, in: query, schema: { type: string, enum: [STATIC_TOP_PANEL, DIGITAL_TOP_PANEL, STATIC_MUPI, DIGITAL_MUPI] } }
        - { name: powerStatus, in: query, schema: { type: string, maxLength: 100 } }
        - { name: accountability, in: query, schema: { type: string, maxLength: 120 } }
        - { name: tentativeClient, in: query, schema: { type: string, maxLength: 120 } }
        - { name: lifecycleStatus, in: query, schema: { type: string, enum: [ACTIVE, REMOVED, MISSING_FROM_SOURCE] } }
        - { name: coordinateState, in: query, schema: { type: string, enum: [VALID, MISSING_OR_INVALID_COORDINATES] } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200":
          description: Inventory page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAssetPage" }
  /inventory/assets/{id}:
    get:
      operationId: getInventoryAsset
      tags: [inventory]
      summary: Get one inventory asset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Inventory asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryAsset" }
        "404": { description: Asset not found }
  /inventory/imports/preview:
    post:
      operationId: previewInventoryImport
      tags: [inventory]
      summary: Validate structured rows and preview import actions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryImportInput" }
      responses:
        "200":
          description: Validated import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryImportPreview" }
        "400": { description: Invalid mapping or request rows }
  /inventory/imports:
    get:
      operationId: listInventoryImports
      tags: [inventory]
      summary: List committed inventory import history
      responses:
        "200":
          description: Import batches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryImportBatch" }
    post:
      operationId: commitInventoryImport
      tags: [inventory]
      summary: Revalidate and atomically commit explicit import choices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryImportCommitInput" }
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryImportBatch" }
        "400": { description: Import validation failed or choices incomplete }
        "409": { description: Inventory changed since preview; preview again }
  /inventory/quality-summary:
    get:
      operationId: getInventoryQualitySummary
      tags: [inventory]
      summary: Derive inventory data quality states from stored fields
      responses:
        "200":
          description: Quality state counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryQualitySummary" }
  /inventory/nearby:
    get:
      operationId: findNearbyInventoryAssets
      tags: [inventory]
      summary: Find coordinate-backed inventory within a straight-line radius
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: thresholdMeters, in: query, required: true, schema: { type: integer, enum: [250, 500, 1000, 2000] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Nearby coordinate-backed assets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NearbyInventoryAsset" }
  /inventory/sync/status:
    get:
      operationId: getInventorySyncStatus
      tags: [inventory]
      summary: Read configured source and last sync without making a Sheets request
      responses:
        "200":
          description: Source connection and sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventorySyncStatus" }
  /inventory/sync:
    post:
      operationId: runInventorySync
      tags: [inventory]
      summary: Synchronize Single and Double shelter tabs from the configured live Google Sheet
      responses:
        "200":
          description: Completed sync run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventorySyncRun" }
        "409": { description: Sync already running or source not configured }
        "502": { description: Google Sheets read failed; no partial inventory changes committed }
  /inventory/sync/history:
    get:
      operationId: listInventorySyncHistory
      tags: [inventory]
      summary: Recent inventory sync runs and changes
      responses:
        "200":
          description: Sync history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventorySyncRun" }
  /inventory/sync/health:
    get:
      operationId: getInventorySourceHealth
      tags: [inventory]
      summary: Source QA, distribution and last run comparison
      responses:
        "200":
          description: Inventory source health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventorySourceHealth" }
  /inventory/sync/conflicts:
    get:
      operationId: getShelterSyncConflicts
      tags: [inventory]
      summary: Inspect shelter source rows quarantined for duplicate identity conflicts
      responses:
        "200":
          description: Shelter sync source conflicts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShelterSyncConflict" }
  /inventory/bus-routes:
    get:
      operationId: listBusRoutes
      tags: [inventory]
      summary: Search and page distinct bus route references and their source variants
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: depot, in: query, schema: { type: string, maxLength: 160 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200":
          description: Bus route reference page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusRoutePage" }
  /inventory/bus-routes/health:
    get:
      operationId: getBusRoutesHealth
      tags: [inventory]
      summary: Summarize active route variants, data gaps, missing routes, and the last source sync
      responses:
        "200":
          description: Bus route reference data health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusRoutesHealth" }
  /inventory/bus-routes/{routeId}:
    get:
      operationId: getBusRoute
      tags: [inventory]
      summary: Get a distinct route and all active source-row variants
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Bus route reference and source variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusRouteDetail" }
        "404": { description: Route not found }
  /inventory/bus-routes/status:
    get:
      operationId: getBusRoutesStatus
      tags: [inventory]
      summary: Read bus route source connection and sync status
      responses:
        "200":
          description: Bus route source connection and sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusRoutesStatus" }
  /inventory/bus-routes/sync:
    post:
      operationId: syncBusRoutes
      tags: [inventory]
      summary: Synchronize distinct route references from all visible source tabs
      responses:
        "200":
          description: Bus route sync run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusRouteSyncRun" }
        "409": { description: Source is not configured or sync already running }
        "502": { description: Google Sheets read failed; no partial route changes committed }
  /inventory/passenger-metrics/upload-url:
    post:
      operationId: createPassengerMetricUploadUrl
      tags: [inventory]
      summary: Create a short-lived private App Storage upload for a passenger ridership CSV
      description: The returned opaque object path is private and is only usable by the authenticated import workflow; no public object-serving URL is provided.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerCsvUploadInput" }
      responses:
        "200":
          description: Short-lived signed upload URL and private object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerCsvUpload" }
        "400":
          description: Invalid file metadata or file size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Private App Storage is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /inventory/passenger-metrics/uploads:
    delete:
      operationId: deletePassengerMetricUpload
      tags: [inventory]
      summary: Delete an abandoned or rejected private passenger CSV upload
      description: Imported source objects are retained for audit and cannot be deleted here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerCsvUploadDeleteInput" }
      responses:
        "204": { description: Private temporary source object deleted }
        "400":
          description: Invalid private object path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Imported source objects are retained for audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Private source object could not be removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /inventory/passenger-metrics/preview:
    post:
      operationId: previewPassengerMetricImport
      tags: [inventory]
      summary: Validate and preview route/month passenger CSV rows against active route variants
      description: Reads the uploaded private object, validates route ridership columns and mapping choices, and returns only source row values needed for review. Invalid or non-ridership sources are removed rather than retained.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerMetricImportInput" }
      responses:
        "200":
          description: Validated rows with conservative route-variant mappings and import quality summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerMetricImportPreview" }
        "400":
          description: Invalid import metadata or unreadable CSV
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: The private source object has already been imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: The CSV contains invalid metric rows or no usable passenger rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerMetricPreviewError" }
  /inventory/passenger-metrics/import:
    post:
      operationId: importPassengerMetrics
      tags: [inventory]
      summary: Import normalized route/month passenger evidence from a private CSV
      description: Preserves the original CSV in private App Storage and records original row values, source row numbers and conservative route-variant mapping status. Passenger metrics remain route-level ridership evidence, not impressions, reach or vehicle availability.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerMetricImportInput" }
      responses:
        "201":
          description: Passenger import batch and mapping/quality counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerMetricImportResult" }
        "400":
          description: Invalid import metadata or no importable rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: The private source object has already been imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Invalid passenger metric rows; no records were imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerMetricImportError" }
  /inventory/passenger-metrics/imports:
    get:
      operationId: listPassengerMetricImports
      tags: [inventory]
      summary: List passenger metric import batches and route mapping counts
      responses:
        "200":
          description: Recent passenger import history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PassengerMetricImportHistoryItem" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /inventory/passenger-metrics:
    get:
      operationId: listPassengerMetrics
      tags: [inventory]
      summary: List normalized monthly passenger records and their route-variant mapping provenance
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum returned rows; runtime clamps this value to 1–1000 and defaults to 250.
          schema: { type: integer, default: 250 }
      responses:
        "200":
          description: Recent normalized route/month ridership records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PassengerRouteMetric" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /inventory/passenger-metrics/{metricId}/mapping:
    put:
      operationId: mapPassengerMetricRouteVariant
      tags: [inventory]
      summary: Confirm a candidate route-variant mapping for an ambiguous or unmatched passenger metric
      description: A selected variant must already be among the source row's candidates. Rows that do not identify a specific variant cannot be assigned across multiple route variants.
      parameters:
        - { name: metricId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerMetricMappingInput" }
      responses:
        "200":
          description: Passenger metric with the confirmed source route mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerRouteMetricMappingResult" }
        "400":
          description: Invalid mapping request or missing rationale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Passenger metric or active route variant not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Mapping is already set, not a candidate, or cannot be safely disambiguated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /projects/{projectId}/network-recommendations:
    get:
      operationId: getNetworkRecommendations
      tags: [inventory]
      summary: Plan a source-backed route mix for a requested bus quantity, not an availability reservation
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Evidence-limited route planning recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkRecommendations" }
        "400": { description: Invalid target quantity }
        "404": { description: Project not found }
    post:
      operationId: planNetworkQuantity
      tags: [inventory]
      summary: Compute a read-only route mix for a specific proposed quantity
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkQuantityInput" }
      responses:
        "200":
          description: Evidence-limited route planning recommendation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkRecommendations" }
        "400": { description: Invalid target quantity }
        "404": { description: Project not found }
  /projects/{projectId}/bus-plan:
    get:
      operationId: getProjectBusPlan
      tags: [inventory]
      summary: Get selected route source variants and proposed bus quantities for a project
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Project bus plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBusPlan" }
        "404": { description: Project not found }
    post:
      operationId: addProjectBusRoute
      tags: [inventory]
      summary: Add a specific route source variant to a project's bus plan
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectBusRouteSelectionInput" }
      responses:
        "201":
          description: Bus route source variant selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBusRouteSelection" }
        "400": { description: "Invalid quantity, status, or override reason" }
        "404": { description: Project or active route source variant not found }
        "409":
          description: Selection conflicts with existing plan data or requires an explicit override
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BusPlanOverrideRequired"
                  - $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/bus-plan/{selectionId}:
    patch:
      operationId: updateProjectBusRoute
      tags: [inventory]
      summary: Update a project route variant selection
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: selectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectBusRouteSelectionUpdate" }
      responses:
        "200":
          description: Updated bus route selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBusRouteSelection" }
        "400": { description: Invalid update or override reason }
        "404": { description: Project selection not found }
        "409":
          description: Quantity exceeds or has no source count and requires an explicit override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusPlanOverrideRequired" }
    delete:
      operationId: removeProjectBusRoute
      tags: [inventory]
      summary: Remove one source variant selection from a project bus plan
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: selectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Bus route selection removed }
        "404": { description: Project selection not found }
  /projects/{projectId}/media-plan:
    get:
      operationId: getProjectMediaPlan
      tags: [inventory]
      summary: Combine exact shelter/media-unit selections with the project's bus plan
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Combined project media plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMediaPlan" }
        "404": { description: Project not found }
  /projects/{projectId}/inventory:
    get:
      operationId: listProjectInventorySelections
      tags: [inventory]
      summary: List inventory selected for a specific project
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Project selections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectInventorySelection" }
        "404": { description: Project not found }
  /projects/{projectId}/inventory/{assetId}:
    put:
      operationId: setProjectInventorySelection
      tags: [inventory]
      summary: Add or update an asset selection for a project
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInventorySelectionInput" }
      responses:
        "200":
          description: Updated project selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectInventorySelection" }
        "404": { description: Project or asset not found }
        "409": { description: Asset is inactive or removed from current inventory and cannot be newly added, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: removeProjectInventorySelection
      tags: [inventory]
      summary: Remove an asset from a project
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Selection removed }
        "404": { description: Project selection not found }
  /projects/{projectId}/inventory/{assetId}/units/{unitId}:
    put:
      operationId: setProjectInventoryUnitSelection
      tags: [inventory]
      summary: Add or update one independently selectable media unit
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInventorySelectionInput" }
      responses:
        "200":
          description: Updated unit selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectInventorySelection" }
        "404": { description: Unit or project not found }
        "409": { description: Shelter or media unit is inactive or removed from current inventory and cannot be newly added, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: removeProjectInventoryUnitSelection
      tags: [inventory]
      summary: Remove an individual unit selection
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unit selection removed }
  /projects/{projectId}/location-strategy:
    get:
      operationId: getProjectLocationStrategy
      tags: [inventory]
      summary: Get a project's editable location strategy
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocationStrategy" }
        "404": { description: Project not found }
    put:
      operationId: saveProjectLocationStrategy
      tags: [inventory]
      summary: Save a draft or approve the project location strategy
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectLocationStrategyInput" }
      responses:
        "200":
          description: Saved strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocationStrategy" }
        "404": { description: Project not found }
  /projects/{projectId}/locations:
    get:
      operationId: listProjectLocations
      tags: [inventory]
      summary: List project-scoped locations and evidence
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectLocation" }
        "404": { description: Project not found }
    post:
      operationId: addProjectLocation
      tags: [inventory]
      summary: Add a user-entered location with explicit evidence
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectLocationInput" }
      responses:
        "201":
          description: Location saved as needing review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocation" }
        "404": { description: Project not found }
  /projects/{projectId}/locations/discover:
    post:
      operationId: discoverProjectLocations
      tags: [inventory]
      summary: Search for location candidates; all results require human review
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationDiscoveryInput" }
      responses:
        "200":
          description: Provider candidates persisted as needing review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectLocation" }
        "404": { description: Project not found }
        "502": { description: Location provider unavailable }
  /projects/{projectId}/locations/{locationId}/review:
    put:
      operationId: reviewProjectLocation
      tags: [inventory]
      summary: Approve or reject a source-backed location
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: locationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectLocationReviewInput" }
      responses:
        "200":
          description: Reviewed location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocation" }
        "404": { description: Project or location not found }
  /projects/{projectId}/location-recommendations/{radiusMeters}:
    get:
      operationId: getProjectLocationRecommendations
      tags: [inventory]
      summary: Generate deterministic shelter and route recommendations from approved strategy and evidence
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: radiusMeters, in: path, required: true, schema: { type: integer, enum: [200, 500, 800, 1000] } }
      responses:
        "200":
          description: Explainable recommendations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationRecommendations" }
        "404": { description: Project not found }
  /projects/{projectId}/store-coverage:
    get:
      operationId: getStoreCoverage
      tags: [inventory]
      summary: Count unique active shelters and media units near approved client locations at four straight-line bands
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Per-location and deduplicated aggregate coverage, not footfall or reach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCoverage" }
        "404": { description: Project not found }
  /projects/{projectId}/location-recommendations/{recommendationId}/decision:
    put:
      operationId: decideProjectLocationRecommendation
      tags: [inventory]
      summary: Shortlist or reject a recommendation with optional feedback
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: recommendationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationRecommendationDecisionInput" }
      responses:
        "200":
          description: Persisted decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationRecommendationDecisionResult" }
        "404": { description: Project or recommendation not found }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LocationCategory:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priority: { type: integer, minimum: 1, maximum: 5 }
      required: [name, priority]
    ProjectLocationStrategyInput:
      type: object
      properties:
        categories: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/LocationCategory" } }
        targetAreas: { type: array, maxItems: 100, items: { type: string, maxLength: 160 } }
        targetRoads: { type: array, maxItems: 100, items: { type: string, maxLength: 160 } }
        audience: { type: ["string", "null"], maxLength: 2000 }
        preferredFormats: { type: array, items: { type: string, enum: [STATIC_TOP_PANEL, DIGITAL_TOP_PANEL, STATIC_MUPI, DIGITAL_MUPI] } }
        campaignScale: { type: string, enum: [FOCUSED, BALANCED, HIGH_PRESENCE] }
        status: { type: string, enum: [DRAFT, APPROVED] }
      required: [categories, targetAreas, targetRoads, audience, preferredFormats, campaignScale, status]
    ProjectLocationStrategy:
      allOf:
        - $ref: "#/components/schemas/ProjectLocationStrategyInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, projectId, createdAt, updatedAt]
    ProjectLocationInput:
      type: object
      properties:
        role: { type: string, enum: [CLIENT, COMPETITOR, POI] }
        name: { type: string, minLength: 1, maxLength: 240 }
        brand: { type: ["string", "null"], maxLength: 240 }
        category: { type: string, minLength: 1, maxLength: 160 }
        address: { type: ["string", "null"], maxLength: 1000 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        area: { type: ["string", "null"], maxLength: 160 }
        sourceUrl: { type: ["string", "null"], format: uri, maxLength: 2048 }
        evidence: { type: string, minLength: 1, maxLength: 4000 }
      required: [role, name, category, evidence]
    ProjectLocation:
      allOf:
        - $ref: "#/components/schemas/ProjectLocationInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            poiId: { type: ["string", "null"], format: uuid }
            locationType:
              type: string
              enum: [BRAND_STORE, AUTHORIZED_RETAILER, CAMPAIGN_ACTIVATION_LOCATION, DEALER_DISTRIBUTOR, EXHIBITION_VENUE, UNVERIFIED_CANDIDATE]
            campaignGeographyStatus:
              type: ["string", "null"]
              enum: [IN_CAMPAIGN_GEOGRAPHY, OUTSIDE_CAMPAIGN_GEOGRAPHY, UNVERIFIED_CAMPAIGN_GEOGRAPHY, null]
            coordinatesSourceUrl: { type: ["string", "null"], format: uri }
            sourceDate: { type: ["string", "null"], format: date }
            evidenceType:
              type: ["string", "null"]
              enum: [HISENSE_OFFICIAL_STORE_LOCATOR, HISENSE_OFFICIAL_CAMPAIGN_PAGE, HISENSE_OFFICIAL_TERMS_PDF, HISENSE_OFFICIAL_RETAILER_LIST, HISENSE_OFFICIAL_NEWSROOM, OFFICIAL_MALL_DIRECTORY, MAP_DIRECTORY, USER_PROVIDED, OTHER, null]
            evidenceStatus:
              type: string
              enum: [OFFICIAL_SOURCE_VERIFIED, OFFICIAL_TEXT_COORDINATES_UNVERIFIED, NEEDS_SOURCE_VERIFICATION, USER_PROVIDED]
            provider: { type: ["string", "null"] }
            providerId: { type: ["string", "null"] }
            sourceReference: { type: ["string", "null"] }
            retrievedAt: { type: string, format: date-time }
            confidence: { type: string, enum: [LIKELY, NEEDS_REVIEW, USER_PROVIDED] }
            reviewStatus: { type: string, enum: [NEEDS_REVIEW, APPROVED, REJECTED] }
            reviewNote: { type: ["string", "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
          required: [id, projectId, poiId, locationType, coordinatesSourceUrl, sourceDate, evidenceType, evidenceStatus, provider, providerId, sourceReference, retrievedAt, confidence, reviewStatus, reviewNote, createdAt, updatedAt]
    LocationDiscoveryInput:
      type: object
      properties:
        query: { type: string, minLength: 2, maxLength: 300 }
        role: { type: string, enum: [CLIENT, COMPETITOR, POI] }
        brand: { type: ["string", "null"], maxLength: 240 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
      required: [query, role]
    ProjectLocationReviewInput:
      type: object
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED, NEEDS_REVIEW] }
        note: { type: ["string", "null"], maxLength: 2000 }
      required: [decision]
    LocationScoreComponent:
      type: object
      properties:
        criterion: { type: string }
        points: { type: integer }
        maximum: { type: integer }
        explanation: { type: string }
      required: [criterion, points, maximum, explanation]
    NearbyProjectLocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [CLIENT, COMPETITOR, POI] }
        name: { type: string }
        category: { type: string }
        distanceMeters: { type: number }
        distanceLabel: { type: string }
      required: [id, role, name, category, distanceMeters, distanceLabel]
    LocationRecommendation:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        inventoryAssetId: { type: ["string", "null"], format: uuid }
        inventoryMediaUnitId: { type: ["string", "null"], format: uuid }
        assetCode: { type: ["string", "null"] }
        assetName: { type: ["string", "null"] }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
        unitType: { type: ["string", "null"] }
        format: { type: ["string", "null"] }
        distanceMeters: { type: ["number", "null"] }
        distanceLabel: { type: ["string", "null"] }
        nearbyLocations: { type: array, items: { $ref: "#/components/schemas/NearbyProjectLocation" } }
        score: { type: integer, minimum: 0, maximum: 100 }
        scoringVersion: { type: string }
        components: { type: array, items: { $ref: "#/components/schemas/LocationScoreComponent" } }
        explanation: { type: array, items: { type: string } }
        missingInformation: { type: array, items: { type: string } }
        decision: { type: string, enum: [UNREVIEWED, SHORTLISTED, REJECTED] }
        decisionReason: { type: ["string", "null"] }
        isCurrent: { type: boolean }
      required: [id, projectId, inventoryAssetId, inventoryMediaUnitId, assetCode, assetName, latitude, longitude, unitType, format, distanceMeters, distanceLabel, nearbyLocations, score, scoringVersion, components, explanation, missingInformation, decision, decisionReason, isCurrent]
    RouteLocationRecommendation:
      type: object
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string }
        sourceVariantId: { type: string, format: uuid }
        from: { type: ["string", "null"] }
        to: { type: ["string", "null"] }
        via: { type: ["string", "null"] }
        depot: { type: ["string", "null"] }
        sourceBusCount: { type: ["integer", "null"] }
        suggestedQuantity: { type: integer, minimum: 1 }
        quantityLabel: { type: string, enum: [AI_SUGGESTED_PLANNING_QUANTITY] }
        score: { type: integer }
        scoringVersion: { type: string }
        explanation: { type: array, items: { type: string } }
        missingInformation: { type: array, items: { type: string } }
        decision: { type: string, enum: [UNREVIEWED, SHORTLISTED, REJECTED] }
        isCurrent: { type: boolean }
      required: [id, routeId, sourceVariantId, from, to, via, depot, sourceBusCount, suggestedQuantity, quantityLabel, score, scoringVersion, explanation, missingInformation, decision, isCurrent]
    LocationRecommendations:
      type: object
      properties:
        projectId: { type: string, format: uuid }
        radiusMeters: { type: integer, enum: [200, 500, 800, 1000] }
        strategyStatus: { type: string, enum: [DRAFT, APPROVED] }
        shelters: { type: array, items: { $ref: "#/components/schemas/LocationRecommendation" } }
        routes: { type: array, items: { $ref: "#/components/schemas/RouteLocationRecommendation" } }
        limitations: { type: array, items: { type: string } }
      required: [projectId, radiusMeters, strategyStatus, shelters, routes, limitations]
    StoreCoverageMediaCounts:
      type: object
      properties:
        digitalTopPanels: { type: integer, minimum: 0 }
        digitalMupis: { type: integer, minimum: 0 }
        static: { type: integer, minimum: 0 }
      required: [digitalTopPanels, digitalMupis, static]
    StoreCoverageLocationBand:
      type: object
      properties:
        shelterCount: { type: integer, minimum: 0 }
